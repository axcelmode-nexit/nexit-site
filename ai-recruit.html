<!doctype html>
<html lang="ja">
<head>
  <link rel="icon" type="image/png" href="favicon.png">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEXIT AI採用アシスタント | AXCEL MODE NEXIT</title>
  <style>
    :root{--bg:#050505;--text:#fff;--muted:#b8b8b8;--line:rgba(255,255,255,.14);--red:#d71920}
    *{box-sizing:border-box}body{margin:0;background:#050505;color:var(--text);font-family:"Noto Sans JP",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.04em}a{color:inherit;text-decoration:none}
    .header{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:24px 7vw;background:linear-gradient(180deg,rgba(0,0,0,.92),rgba(0,0,0,0))}
    .brand img{width:190px}.nav{display:flex;gap:24px;font-size:12px;font-weight:900;letter-spacing:.18em}
    .hero{min-height:100vh;padding:150px 7vw 80px;display:grid;grid-template-columns:minmax(0,.9fr) minmax(320px,1.1fr);gap:64px;align-items:center;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(0,0,0,.94),rgba(0,0,0,.78),rgba(0,0,0,.45)),linear-gradient(180deg,rgba(0,0,0,.10),rgba(0,0,0,.74)),url("mountain.jpg") right center/cover no-repeat}
    .eyebrow{color:var(--red);font-size:13px;font-weight:900;letter-spacing:.22em;margin-bottom:24px}h1{font-size:clamp(42px,5.5vw,78px);line-height:1.18;margin:0 0 28px;font-weight:900;text-shadow:0 10px 32px rgba(0,0,0,.75)}
    .red-line{width:48px;height:2px;background:var(--red);margin:0 0 24px}.lead{max-width:680px;font-size:17px;line-height:2;font-weight:800;color:rgba(255,255,255,.9);margin:0 0 32px}
    .quick{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.quick button{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.045);color:#fff;padding:12px 14px;font-size:12px;font-weight:800;cursor:pointer}.quick button:hover{border-color:rgba(255,255,255,.55)}
    .chat{border:1px solid var(--line);background:rgba(5,5,5,.84);box-shadow:0 30px 80px rgba(0,0,0,.45);min-height:620px;display:flex;flex-direction:column}.chat-head{padding:24px 26px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.chat-title{font-weight:900;letter-spacing:.12em}.chat-sub{color:var(--muted);font-size:12px;margin-top:6px}
    .status{display:flex;align-items:center;gap:8px;color:#ddd;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 14px rgba(215,25,32,.9)}
    .messages{flex:1;padding:24px;overflow:auto;display:flex;flex-direction:column;gap:14px}.msg{max-width:88%;padding:15px 17px;border:1px solid rgba(255,255,255,.12);line-height:1.85;font-size:14px;white-space:pre-wrap}.msg.ai{align-self:flex-start;background:rgba(255,255,255,.045)}.msg.user{align-self:flex-end;background:rgba(215,25,32,.16);border-color:rgba(215,25,32,.45)}
    .chat-form{display:flex;gap:12px;padding:18px;border-top:1px solid var(--line);background:rgba(0,0,0,.36)}textarea{flex:1;min-height:54px;max-height:150px;resize:vertical;border:1px solid rgba(255,255,255,.18);background:#050505;color:#fff;padding:15px;font:inherit;line-height:1.6;outline:none}.send{width:120px;border:1px solid rgba(255,255,255,.58);background:transparent;color:#fff;font-weight:900;letter-spacing:.12em;cursor:pointer}.send:hover{background:#fff;color:#000}.send:disabled{opacity:.45}
    .note{color:var(--muted);font-size:12px;line-height:1.8;margin-top:18px}
    @media(max-width:980px){.header{padding:20px 6vw}.brand img{width:150px}.nav{gap:14px;font-size:10px}.hero{grid-template-columns:1fr;min-height:auto;padding:120px 6vw 70px;gap:42px;background-position:62% center}.chat{min-height:590px}.msg{max-width:96%}.chat-form{flex-direction:column}.send{width:100%;height:52px}}
  </style>
</head>
<body>
  <header class="header">
  <a class="brand" href="https://axcelmode-nexit.jp/">
    <img src="logo.png" alt="AXCEL MODE NEXIT">
  </a>
  <nav class="nav">
    <a href="https://axcelmode-nexit.jp/">TOP</a>
    <a href="https://axcelmode-nexit.jp/recruit.html">RECRUIT</a>
  </nav>
</header>
  <main><section class="hero">
    <div><div class="eyebrow">NEXIT AI RECRUIT</div><h1>AI採用アシスタントに、<br>聞いてみる。</h1><div class="red-line"></div><p class="lead">AXCEL MODE NEXITの働き方、募集内容、上越での勤務、東京案件、AI活用、平均65％還元について、AIが24時間お答えします。</p>
      <div class="quick">
<button type="button" data-q="募集職種について教えてください。">💼 募集職種</button>
<button type="button" data-q="AIエンジニアとはどのような仕事ですか？">🤖 AIエンジニア</button>
<button type="button" data-q="上越で働く魅力を教えてください。">🏡 上越で働く</button>
<button type="button" data-q="給与や評価制度について教えてください。">💰 給与・制度</button>
<button type="button" data-q="アクセル・モードグループについて教えてください。">🤝 グループについて</button>
<button type="button" data-q="応募方法を教えてください。">✉️ 応募方法</button>
</div>
      <p class="note">※AIの回答は採用ページの情報をもとにした案内です。正式な条件は面談時にご確認ください。</p></div>
    <div class="chat"><div class="chat-head"><div><div class="chat-title">NEXIT AI</div><div class="chat-sub">Recruit Assistant</div></div><div class="status"><span class="dot"></span> ONLINE</div></div><div class="messages" id="messages"><div class="msg ai">こんにちは。NEXIT AI採用アシスタントです。働き方、募集内容、上越勤務、AI活用など、気になることを聞いてください。</div></div><form class="chat-form" id="chatForm"><textarea id="question" placeholder="例：リモートワークはできますか？" required></textarea><button class="send" id="sendBtn" type="submit">SEND</button></form></div>
  </section></main>
  <script>
const messages = document.getElementById("messages");
const form = document.getElementById("chatForm");
const question = document.getElementById("question");
const sendBtn = document.getElementById("sendBtn");

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

async function askAI(text) {
  addMessage("user", text);
  const pending = addMessage("ai", "回答を作成しています...");
  sendBtn.disabled = true;

  try {
    const res = await fetch("/api/recruit-chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || "AI error");
    }

    pending.textContent = data.answer;
  } catch (err) {
    pending.textContent = "すみません。現在AIが応答できません。時間をおいて再度お試しください。";
    console.error(err);
  } finally {
    sendBtn.disabled = false;
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = question.value.trim();
  if (!text) return;
  question.value = "";
  await askAI(text);
});

document.querySelectorAll("[data-q]").forEach((btn) => {
  btn.addEventListener("click", () => askAI(btn.dataset.q));
});
</script>
</body>
</html>
