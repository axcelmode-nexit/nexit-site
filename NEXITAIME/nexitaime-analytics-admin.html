<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEXITAIME Analytics</title>
<style>
:root{
  --bg:#f6f8fb;--card:#fff;--text:#17324d;--muted:#72839a;--line:#dfe7ef;
  --accent:#20a8e8;--accent2:#6b74f8;--soft:#eef8ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.wrap{max-width:980px;margin:auto;padding:22px 16px 60px}
.header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}
h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:5px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
button,select,input{font:inherit}
button,.select{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;color:var(--text);font-weight:700}
button.primary{border:0;color:#fff;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 8px 24px rgba(38,72,106,.05)}
.kpi .label{font-size:12px;color:var(--muted);font-weight:700}.kpi .value{font-size:30px;font-weight:900;margin-top:6px}
.section{margin-top:14px}.section h2{font-size:16px;margin:0 0 12px}
.bar-row{display:grid;grid-template-columns:minmax(90px,1fr) 3fr 46px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.bar{height:12px;border-radius:999px;background:#edf2f7;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px}
.spark{display:flex;gap:4px;height:110px;align-items:flex-end;padding-top:8px}
.spark i{flex:1;min-width:6px;border-radius:5px 5px 0 0;background:linear-gradient(var(--accent2),var(--accent));position:relative}
.spark i span{display:none}
.empty{color:var(--muted);font-size:13px}
.login{max-width:460px;margin:15vh auto 0;background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px}
.login h1{margin-bottom:8px}.login p{color:var(--muted);font-size:13px}
.login input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;margin:8px 0 10px}
.error{color:#c0392b;font-size:13px;margin-top:9px}
.meta{color:var(--muted);font-size:12px;margin-top:14px}
@media(max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}.header{display:block}.controls{margin-top:12px}.bar-row{grid-template-columns:100px 1fr 36px}.kpi .value{font-size:26px}}
</style>
</head>
<body>
<div id="login" class="login">
  <h1>NEXITAIME Analytics</h1>
  <p>管理用キーを入力してください。キーはこのタブを閉じるまでだけ保持します。</p>
  <input id="key" type="password" autocomplete="current-password" placeholder="管理用キー">
  <button class="primary" id="loginBtn">ダッシュボードを開く</button>
  <div class="error" id="loginErr"></div>
</div>

<div id="app" class="wrap" hidden>
  <div class="header">
    <div>
      <h1>NEXITAIME Analytics</h1>
      <div class="sub">匿名イベント集計</div>
    </div>
    <div class="controls">
      <select id="days" class="select">
        <option value="7">直近7日</option>
        <option value="30" selected>直近30日</option>
        <option value="90">直近90日</option>
      </select>
      <button id="reload">更新</button>
      <button id="logout">ログアウト</button>
    </div>
  </div>

  <div class="grid">
    <div class="card kpi"><div class="label">検索回数</div><div class="value" id="searches">—</div></div>
    <div class="card kpi"><div class="label">ページ表示</div><div class="value" id="pageViews">—</div></div>
    <div class="card kpi"><div class="label">セッション</div><div class="value" id="sessions">—</div></div>
    <div class="card kpi"><div class="label">平均空き時間</div><div class="value" id="avgFree">—</div></div>
    <div class="card kpi"><div class="label">AI/条件調整</div><div class="value" id="adjusts">—</div></div>
    <div class="card kpi"><div class="label">シェア</div><div class="value" id="shares">—</div></div>
    <div class="card kpi"><div class="label">お気に入り追加</div><div class="value" id="favorites">—</div></div>
    <div class="card kpi"><div class="label">全イベント</div><div class="value" id="events">—</div></div>
  </div>

  <div class="card section">
    <h2>検索回数の推移</h2>
    <div id="daily" class="spark"></div>
  </div>

  <div class="grid section">
    <div class="card"><h2>移動手段</h2><div id="transport"></div></div>
    <div class="card"><h2>気分</h2><div id="mood"></div></div>
    <div class="card"><h2>行き先エリア</h2><div id="destination"></div></div>
    <div class="card"><h2>イベント内訳</h2><div id="eventsBreakdown"></div></div>
  </div>

  <div class="meta" id="meta"></div>
</div>

<script>
const API = "./api/nexitaime-analytics";
const labels = {
  auto:"おまかせ", privatecar:"自家用車", mobilitycar:"カーシェア・レンタカー",
  public:"公共交通", taxi:"タクシー", walk:"徒歩", bike:"レンタル自転車",
  any:"指定なし", food:"食事", cafe:"カフェ", sightseeing:"観光", event:"イベント",
  nature:"自然", onsen:"温泉", active:"アクティブ", rain:"雨向け",
  central:"高田周辺", kasugayama:"春日山", sea:"直江津・海側", east:"東部",
  mountain:"山側", myoko:"妙高",
  page_view:"ページ表示", search_start:"検索開始", search_result:"検索結果",
  plan_adjust:"プラン調整", favorite_add:"お気に入り追加", favorite_remove:"お気に入り解除",
  favorite_rerun:"お気に入り再検索", share:"シェア", corporate_click:"会社リンク"
};

const $ = id => document.getElementById(id);
let adminKey = sessionStorage.getItem("nexitaime-admin-key") || "";

$("key").value = adminKey;

$("loginBtn").onclick = async () => {
  adminKey = $("key").value.trim();
  if (!adminKey) return;
  sessionStorage.setItem("nexitaime-admin-key", adminKey);
  await load(true);
};

$("reload").onclick = () => load(false);
$("days").onchange = () => load(false);
$("logout").onclick = () => {
  sessionStorage.removeItem("nexitaime-admin-key");
  location.reload();
};

async function load(fromLogin){
  try{
    $("loginErr").textContent="";
    const days = $("days")?.value || "30";
    const res = await fetch(`${API}?days=${encodeURIComponent(days)}`, {
      headers: {"X-Admin-Key": adminKey},
      cache:"no-store"
    });
    if(res.status===401) throw new Error("管理用キーが違います。");
    if(!res.ok){
      const x=await res.json().catch(()=>({}));
      throw new Error(x.error || `HTTP ${res.status}`);
    }
    const data=await res.json();
    $("login").hidden=true;
    $("app").hidden=false;
    render(data);
  }catch(e){
    if(fromLogin){
      $("loginErr").textContent=e.message || "読み込みに失敗しました。";
    }else{
      alert(e.message || "読み込みに失敗しました。");
    }
  }
}

function render(data){
  const t=data.totals||{};
  $("searches").textContent=num(t.searches);
  $("pageViews").textContent=num(t.page_views);
  $("sessions").textContent=num(t.sessions);
  $("avgFree").textContent=t.avg_free_minutes==null?"—":`${Math.round(t.avg_free_minutes)}分`;
  $("adjusts").textContent=num(t.plan_adjusts);
  $("shares").textContent=num(t.shares);
  $("favorites").textContent=num(t.favorites);
  $("events").textContent=num(t.events);

  bars("transport",data.topTransport||[]);
  bars("mood",data.topMood||[]);
  bars("destination",data.topDestination||[]);
  bars("eventsBreakdown",data.eventBreakdown||[]);
  spark("daily",data.dailySearches||[]);

  $("meta").textContent = `集計期間：直近${data.days}日 / 最終イベント：${t.latest_event_at ? new Date(t.latest_event_at).toLocaleString("ja-JP") : "まだありません"}`;
}

function bars(id, rows){
  const el=$(id);
  if(!rows.length){el.innerHTML='<div class="empty">まだデータがありません</div>';return}
  const max=Math.max(...rows.map(r=>Number(r.value)||0),1);
  el.innerHTML=rows.map(r=>{
    const v=Number(r.value)||0;
    const name=labels[r.label]||r.label||"不明";
    return `<div class="bar-row"><b>${esc(name)}</b><div class="bar"><i style="width:${Math.max(4,v/max*100)}%"></i></div><strong>${v}</strong></div>`;
  }).join("");
}

function spark(id,rows){
  const el=$(id);
  if(!rows.length){el.innerHTML='<div class="empty">まだ検索データがありません</div>';return}
  const max=Math.max(...rows.map(r=>Number(r.value)||0),1);
  el.innerHTML=rows.map(r=>{
    const v=Number(r.value)||0;
    const h=Math.max(5,v/max*100);
    return `<i style="height:${h}%" title="${esc(r.label)}: ${v}回"><span>${v}</span></i>`;
  }).join("");
}

function num(v){return Number(v||0).toLocaleString("ja-JP")}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

if(adminKey) load(true);
</script>
</body>
</html>
